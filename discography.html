<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marga - Discography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <section id="portfolio-showcase">
            <h2 data-translate="discography"></h2>
            <!-- <p>A selection of not a lot for now.</p> -->
            <div class="music-card">
                <div class="left-music">
                    <h3 style="margin-top: 0;">So Close(d)</h3>
                    <p class="metadata">Release date: Soon™</p>
                    <p class="metadata">Genre: Indie folk</p>
                    <p>My first single.</p>
                    <a href="https://www.youtube.com/watch?v=xMHJGd3wwZk" class="cta-button"
                        style="display: inline-block; margin-top: 15px; padding: 8px 20px;">Listen Now</a>
                </div>
                <div class="right-music">
                    <a href="music.html?id=soclosed">
                        <img class="cover" src="./images/So Close(d).png" title="So Close(d)" alt="So Close(d)">
                    </a>
                </div>
            </div>

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="scripts/include-components.js" type="text/javascript"></script>
    <script src="scripts/translate-content.js" type="text/javascript"></script>
    <script src="scripts/main-orchestrator.js" type="text/javascript"></script>
    <script src="scripts/responsive.js" type="text/javascript"></script>
</body>

</html>
